[build-system]
requires = ["setuptools>=68,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "civiclens-ml-service"
version = "0.1.0"
description = "Phase 1 CivicLens ML service"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi==0.121.3",
    "pydantic==2.12.3",
    "pydantic-settings==2.11.0",
    "uvicorn[standard]==0.38.0",
]

[project.optional-dependencies]
test = [
    "httpx==0.28.1",
    "pytest==8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
